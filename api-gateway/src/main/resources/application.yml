server:
  port: 8085

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Autoconfiguracion: el decoder resuelve el issuer de forma perezosa, Keycloak no tiene que estar arriba al arrancar
          issuer-uri: http://localhost:8080/realms/gimnasio
  cloud:
    gateway:
      server:
        webflux:
          # Rutas declaradas en YAML. La ruta de equipos esta en GatewayConfig (Java DSL), equivalente.
          routes:
            # lb:// = el nombre lo resuelve Eureka y el balanceador elige la instancia
            - id: miembros-pagos
              uri: lb://miembros-service
              predicates:
                - Path=/api/miembros/**,/api/pagos/**
            - id: clases
              uri: lb://clases-service
              predicates:
                - Path=/api/clases/**
            - id: entrenadores
              uri: lb://entrenadores-service
              predicates:
                - Path=/api/entrenadores/**
            # Agregacion: el filtro responde el mismo, no se reenvia a ningun backend (por eso no://op)
            - id: resumen-miembro
              uri: no://op
              predicates:
                - Path=/api/resumen/miembros/{id}
              filters:
                - ResumenMiembro

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
